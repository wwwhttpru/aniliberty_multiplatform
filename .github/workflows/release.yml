name: Release artifacts

on:
  # Быстрый тест руками (не нужно пушить тег)
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag like v1.0.0-test (will be used for version/build-name too)"
        required: true
        type: string

  # Боевой релиз по тегу
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version-file: pubspec.yaml

      - name: Extract version from tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          echo "Using TAG=$TAG"
          echo "Using VERSION=$VERSION"
          echo "Using BUILD_NUMBER=${GITHUB_RUN_NUMBER}"

      - name: Compute GitHub Pages base-href
        id: pages
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          # owner.github.io repo -> base-href "/", иначе "/<repo>/"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            BASE_HREF="/"
          else
            BASE_HREF="/${REPO_NAME}/"
          fi

          echo "base_href=$BASE_HREF" >> $GITHUB_OUTPUT
          echo "PAGES_BASE_HREF=$BASE_HREF"

      - name: Pub get dependencies
        run: flutter pub get

      - name: Codegen
        run: flutter pub run build_runner build -d

      # WEB
      - name: Build web (release)
        run: |
          flutter build web --wasm --release \
            --target lib/main_web.dart \
            --base-href "${{ steps.pages.outputs.base_href }}" \
            --build-name="${{ steps.ver.outputs.version }}" \
            --build-number="${GITHUB_RUN_NUMBER}"

      - name: Archive web build
        shell: bash
        run: |
          test -d build/web
          (cd build && zip -r "../web-${{ steps.ver.outputs.tag }}.zip" web)

      - name: Deploy web to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: build/web
          force_orphan: true

      # ANDROID (release, obfuscate, symbols в build/symbols/android/<tag>)
      - name: Build Android APK (release, obfuscate)
        run: |
          flutter build apk --release \
            --target lib/main.dart \
            --build-name="${{ steps.ver.outputs.version }}" \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --obfuscate \
            --split-debug-info=build/symbols/android/${{ steps.ver.outputs.tag }}

      - name: Build Android AAB (release, obfuscate)
        run: |
          flutter build appbundle --release \
            --target lib/main.dart \
            --build-name="${{ steps.ver.outputs.version }}" \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --obfuscate \
            --split-debug-info=build/symbols/android/${{ steps.ver.outputs.tag }}

      - name: Prepare files (stable names)
        shell: bash
        run: |
          APK_PATH="$(ls -1 build/app/outputs/flutter-apk/*.apk | head -n 1)"
          AAB_PATH="$(ls -1 build/app/outputs/bundle/release/*.aab | head -n 1)"

          test -f "$APK_PATH"
          test -f "$AAB_PATH"

          cp "$APK_PATH" "app-android-${{ steps.ver.outputs.tag }}.apk"
          cp "$AAB_PATH" "app-android-${{ steps.ver.outputs.tag }}.aab"

      - name: Archive Android symbols (split-debug-info)
        shell: bash
        run: |
          SYMBOL_DIR="build/symbols/android/${{ steps.ver.outputs.tag }}"
          if [ ! -d "$SYMBOL_DIR" ]; then
            echo "Symbols dir not found: $SYMBOL_DIR"
            exit 1
          fi

          (cd build/symbols && zip -r "../../android-symbols-${{ steps.ver.outputs.tag }}.zip" "android/${{ steps.ver.outputs.tag }}")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}

          # В режиме ручного теста делаем черновик/пререлиз, чтобы не засорять Releases
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}

          generate_release_notes: true
          files: |
            web-${{ steps.ver.outputs.tag }}.zip
            app-android-${{ steps.ver.outputs.tag }}.apk
            app-android-${{ steps.ver.outputs.tag }}.aab
            android-symbols-${{ steps.ver.outputs.tag }}.zip
